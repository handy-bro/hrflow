<app-auth-card title="Activate Account" subtitle="Set your password to finish activation">
    <form (ngSubmit)="onSubmit()">
        <div class="flex flex-col gap-6">
            @if (!tokenValid()) {
                <div class="text-center">
                    <i class="pi pi-times-circle text-4xl text-red-500 mb-4"></i>
                    <p class="text-muted-color mb-4">This activation link is invalid or has expired.</p>
                    <p-button label="Back to Login" styleClass="w-full" routerLink="/login"></p-button>
                </div>
            } @else if (!success()) {
                <div>
                    <label for="password" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">Password</label>
                    <p-password
                        id="password"
                        [ngModel]="payload().password"
                        (ngModelChange)="updatePassword($event)"
                        name="password"
                        placeholder="Password"
                        [toggleMask]="true"
                        styleClass="mb-4"
                        [fluid]="true"
                        required
                    ></p-password>
                </div>

                <div>
                    <label for="confirmPassword" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">Confirm Password</label>
                    <p-password
                        id="confirmPassword"
                        [ngModel]="payload().confirmPassword"
                        (ngModelChange)="updateConfirmPassword($event)"
                        name="confirmPassword"
                        placeholder="Confirm password"
                        [toggleMask]="true"
                        styleClass="mb-4"
                        [fluid]="true"
                        [feedback]="false"
                        required
                    ></p-password>
                </div>

                <p-button
                    type="submit"
                    label="Activate Account"
                    styleClass="w-full"
                    [loading]="loading()"
                ></p-button>
            } @else {
                <div class="text-center">
                    <i class="pi pi-check-circle text-4xl text-primary mb-4"></i>
                    <p class="text-muted-color mb-4">Your account is now active.</p>
                    <p-button label="Go to Login" styleClass="w-full" routerLink="/login"></p-button>
                </div>
            }
        </div>
    </form>
</app-auth-card>
