<app-auth-card title="Reset Password" subtitle="Set your new password">
    <form (ngSubmit)="onSubmit()">
        <div class="flex flex-col gap-6">
            @if (!success()) {
                <div>
                    <label for="newPassword" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">New Password</label>
                    <p-password
                        id="newPassword"
                        [ngModel]="payload().newPassword"
                        (ngModelChange)="updateNewPassword($event)"
                        name="newPassword"
                        placeholder="New password"
                        [toggleMask]="true"
                        styleClass="mb-4"
                        [fluid]="true"
                        required
                    ></p-password>
                </div>

                <div>
                    <label for="confirmPassword" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">Confirm Password</label>
                    <p-password
                        id="confirmPassword"
                        [ngModel]="payload().confirmPassword"
                        (ngModelChange)="updateConfirmPassword($event)"
                        name="confirmPassword"
                        placeholder="Confirm password"
                        [toggleMask]="true"
                        styleClass="mb-4"
                        [fluid]="true"
                        [feedback]="false"
                        required
                    ></p-password>
                </div>

                <p-button
                    type="submit"
                    label="Reset Password"
                    styleClass="w-full"
                    [loading]="loading()"
                ></p-button>
            } @else {
                <div class="text-center">
                    <i class="pi pi-check-circle text-4xl text-primary mb-4"></i>
                    <p class="text-muted-color mb-4">Your password has been reset successfully.</p>
                    <p-button label="Go to Login" styleClass="w-full" routerLink="/login"></p-button>
                </div>
            }
        </div>
    </form>
</app-auth-card>
