<app-auth-card title="Forgot Password" subtitle="Enter your email to receive reset instructions">
    <form (ngSubmit)="onSubmit()">
        <div class="flex flex-col gap-6">
            @if (!sent()) {
                <div>
                    <label for="email" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Email</label>
                    <input
                        pInputText
                        id="email"
                        type="email"
                        placeholder="Email address"
                        class="w-full md:w-120"
                        [ngModel]="payload().email"
                        (ngModelChange)="updateEmail($event)"
                        name="email"
                        required
                        email
                    />
                </div>

                <p-button
                    type="submit"
                    label="Send Reset Link"
                    styleClass="w-full"
                    [loading]="loading()"
                ></p-button>
            } @else {
                <div class="text-center">
                    <i class="pi pi-check-circle text-4xl text-primary mb-4"></i>
                    <p class="text-muted-color">If an account exists, a reset email has been sent.</p>
                </div>
            }

            <div class="text-center mt-4">
                <a routerLink="/login" class="font-medium text-primary no-underline">Back to login</a>
            </div>
        </div>
    </form>
</app-auth-card>
