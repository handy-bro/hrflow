spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/hrflow_db
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: localhost
    port: 9025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          trust: "*"
          auth: false
          starttls:
            enable: false

server:
  port: 8080



application:
  security:
    jwt:
      secret-key: ${TOKEN_SECRET}
      expiration: ${TOKEN_EXPIRATION}
      refresh-token:
        expiration: ${REFRESH_TOKEN_EXPIRATION}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  use-management-port: false
  default-flat-param-object: true

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
  bucket: ${STORAGE_BUCKET:hrflow-uploads}
  public-base-url: ${STORAGE_PUBLIC_URL}
  region: ${STORAGE_REGION:auto}

leave-policy:
  annual-days: 25
  sick-days: 10
  maternity-paternity-days: 90

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
