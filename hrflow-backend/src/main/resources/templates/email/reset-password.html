<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{email/layout :: layout(~{::content})}">
    <div th:fragment="content">
        <h1 style="margin:0 0 16px; font-size:20px; color:#111827;">Password Reset</h1>

        <p style="margin:0 0 24px; font-size:14px; color:#374151; line-height:1.6;">
            You have requested to reset your password. Click the button below to choose a new one.
        </p>

        <table role="presentation" cellpadding="0" cellspacing="0">
            <tr>
                <td style="border-radius:6px; background-color:#dc2626;">
                    <a th:href="${link}"
                       style="display:inline-block; padding:12px 28px; font-size:14px; font-weight:600; color:#ffffff; text-decoration:none;">
                        Reset my password
                    </a>
                </td>
            </tr>
        </table>

        <p style="margin:24px 0 0; font-size:13px; color:#6b7280;">
            This link expires in <strong th:text="${expiryHours}">1</strong> hour.
        </p>
    </div>
</th:block>
</body>
</html>
