<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{email/layout :: layout(~{::content})}">
    <div th:fragment="content">
        <h1 style="margin:0 0 16px; font-size:20px; color:#111827;">
            Your leave request has been
            <span th:text="${approved} ? 'approved' : 'rejected'"
                  th:style="${approved} ? 'color:#16a34a;' : 'color:#dc2626;'">status</span>
        </h1>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="background-color:#f9fafb; border-radius:6px; margin-bottom:20px;">
            <tr>
                <td style="padding:16px 20px; font-size:14px; color:#374151;">
                    <p style="margin:0 0 8px;"><strong>From:</strong> <span th:text="${startDate}">2026-08-10</span></p>
                    <p style="margin:0;"><strong>To:</strong> <span th:text="${endDate}">2026-08-14</span></p>
                </td>
            </tr>
        </table>

        <div th:if="${comment != null and !comment.isBlank()}"
             style="padding:12px 16px; background-color:#fffbeb; border-left:3px solid #f59e0b; margin-bottom:24px;">
            <p style="margin:0; font-size:13px; color:#78350f;">
                <strong>Manager's comment:</strong><br/>
                <span th:text="${comment}"></span>
            </p>
        </div>

        <table role="presentation" cellpadding="0" cellspacing="0">
            <tr>
                <td style="border-radius:6px; background-color:#2563eb;">
                    <a th:href="${link}"
                       style="display:inline-block; padding:12px 28px; font-size:14px; font-weight:600; color:#ffffff; text-decoration:none;">
                        View details
                    </a>
                </td>
            </tr>
        </table>
    </div>
</th:block>
</body>
</html>
