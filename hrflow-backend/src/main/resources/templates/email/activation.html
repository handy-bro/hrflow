<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{email/layout :: layout(~{::content})}">
    <div th:fragment="content">
        <h1 style="margin:0 0 16px; font-size:20px; color:#111827;">Welcome to HRFlow</h1>

        <p style="margin:0 0 16px; font-size:14px; color:#374151; line-height:1.6;">
            Hello <span th:text="${firstName}">John</span>,
        </p>

        <p style="margin:0 0 24px; font-size:14px; color:#374151; line-height:1.6;">
            An account has been created for you on HRFlow. Click the button below
            to activate it and set your password.
        </p>

        <table role="presentation" cellpadding="0" cellspacing="0">
            <tr>
                <td style="border-radius:6px; background-color:#2563eb;">
                    <a th:href="${link}"
                       style="display:inline-block; padding:12px 28px; font-size:14px; font-weight:600; color:#ffffff; text-decoration:none;">
                        Activate my account
                    </a>
                </td>
            </tr>
        </table>

        <p style="margin:24px 0 0; font-size:13px; color:#6b7280; line-height:1.6;">
            This link expires in <strong th:text="${expiryHours}">24</strong> hours.
        </p>

        <p style="margin:16px 0 0; font-size:12px; color:#9ca3af; word-break:break-all;">
            Or copy this link into your browser:<br/>
            <span th:text="${link}">http://...</span>
        </p>
    </div>
</th:block>
</body>
</html>
